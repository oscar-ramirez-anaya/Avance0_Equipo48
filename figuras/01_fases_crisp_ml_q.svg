<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#ffffff" viewBox="0 0 640 230" width="600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b3b8c"/>
    </marker>
  </defs>
  <!-- fila superior -->
  <rect x="10" y="20" width="180" height="62" rx="6" fill="#0b3b8c"/>
  <text x="100" y="45" fill="#fff" font-size="12.5" text-anchor="middle" font-weight="600">1. Entendimiento del</text>
  <text x="100" y="62" fill="#fff" font-size="12.5" text-anchor="middle" font-weight="600">negocio y de los datos</text>
  <rect x="230" y="20" width="180" height="62" rx="6" fill="#e8eef9" stroke="#0b3b8c"/>
  <text x="320" y="47" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">2. Ingeniería</text>
  <text x="320" y="64" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">de datos</text>
  <rect x="450" y="20" width="180" height="62" rx="6" fill="#e8eef9" stroke="#0b3b8c"/>
  <text x="540" y="47" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">3. Ingeniería</text>
  <text x="540" y="64" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">del modelo</text>
  <!-- fila inferior -->
  <rect x="450" y="140" width="180" height="62" rx="6" fill="#e8eef9" stroke="#0b3b8c"/>
  <text x="540" y="167" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">4. Evaluación</text>
  <text x="540" y="184" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">del modelo</text>
  <rect x="230" y="140" width="180" height="62" rx="6" fill="#e8eef9" stroke="#0b3b8c"/>
  <text x="320" y="176" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">5. Despliegue</text>
  <rect x="10" y="140" width="180" height="62" rx="6" fill="#e8eef9" stroke="#0b3b8c"/>
  <text x="100" y="167" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">6. Monitoreo y</text>
  <text x="100" y="184" fill="#0b3b8c" font-size="12.5" text-anchor="middle" font-weight="600">mantenimiento</text>
  <!-- flechas -->
  <line x1="190" y1="51" x2="228" y2="51" stroke="#0b3b8c" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="410" y1="51" x2="448" y2="51" stroke="#0b3b8c" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="540" y1="82" x2="540" y2="138" stroke="#0b3b8c" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="450" y1="171" x2="412" y2="171" stroke="#0b3b8c" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="230" y1="171" x2="192" y2="171" stroke="#0b3b8c" stroke-width="1.6" marker-end="url(#fl)"/>
  <path d="M100,140 L100,84" stroke="#0b3b8c" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#fl)"/>
  <text x="108" y="116" fill="#5a5a5a" font-size="10.5">retroalimentación</text>
  <text x="320" y="118" fill="#5a5a5a" font-size="10.5" text-anchor="middle">Aseguramiento de calidad en cada fase:</text>
  <text x="320" y="132" fill="#5a5a5a" font-size="10.5" text-anchor="middle">requisitos, riesgos y medidas de mitigación</text>
</svg>